name: Warning Filters

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '*'

jobs:
  warnings:
    name: Test Suite (warnings as errors)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          channels: conda-forge,defaults
          python-version: "3.12"
          channel-priority: true
      - name: Install Non-Python Dependencies
        run: |
          conda install pip fftw gsl numba compilers pkg-config
      - name: Install 21cmFAST
        run: |
          python -m pip install ".[dev]"
      - name: Run Tests with Warnings as Errors
        run: |
          python -m pytest -W error -n 2 -l \
          --ignore tests/test_integration_features.py \
          --tb=short
