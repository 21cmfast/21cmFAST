name: Update Draft Release

# Only keep the draft of the next release from main up to date. There is a single
# draft, so pushes to any other branch (including the release maintenance branches)
# would retarget it and overwrite its notes. Notes for patch releases made from a
# release-vX.Y.x branch are generated when creating the release on GitHub instead.
on:
  push:
    branches:
      - 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    name: Update Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
