name: Continuous Benchmarking

on:
  push:
    # Release branches are tracked too, since PRs into them use them as the start
    # point for their benchmarks (see fork_pr_benchmarks_track.yml).
    branches:
      - main
      - "release-v*"

jobs:
  benchmark_base_branch:
    name: Continuous Benchmarking
    runs-on: ubuntu-latest
    defaults:
        run:
          # Adding -l {0} ensures conda can be found properly in each step
          shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
      - uses: bencherdev/bencher@main

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
            channels: conda-forge,defaults
            python-version: 3.12
            channel-priority: true

      - name: Install Non-Python Dependencies
        run: |
          conda install fftw gsl numba

      - name: Cache FFTW Wisdom
        id: wisdom
        uses: ./.github/actions/cache-fftw-wisdom

      - name: Install 21cmFAST
        run: |
          pip install ".[dev]"

      - name: Track base branch benchmarks with Bencher
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          # Passed via env (not interpolated into the script) so that a branch name
          # can't inject shell commands.
          BENCHER_BRANCH: ${{ github.ref_name }}
          WISDOMS_PATH: ${{ steps.wisdom.outputs.path }}
        run: |
          bencher run \
          --project 21cmfast \
          --branch "$BENCHER_BRANCH" \
          --testbed ubuntu-latest \
          --threshold-measure latency \
          --threshold-test percentage \
          --threshold-max-sample-size 64 \
          --threshold-upper-boundary 0.1 \
          --thresholds-reset \
          --err \
          --adapter python_pytest \
          --file results.json \
          "pytest --benchmark-json results.json tests/test_integration_features.py --wisdoms-path '$WISDOMS_PATH'"
